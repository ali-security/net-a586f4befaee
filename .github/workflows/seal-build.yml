name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Go package patterns to test (empty = ./...)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    name: Build module zip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" ./create_mod.go

      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          # upstream ships no .github; drop the seal build plumbing from the zipped tree
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" golang.org/x/net v0.45.0 \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/out/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.45.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.45.0.zip
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: |
          set -eux
          go version
          go build ./...

      # GitHub's Ubuntu runners disallow unprivileged ICMP sockets, lo has no
      # MULTICAST flag, and nettest.RoutedInterface("ip6", Up|Loopback) ignores
      # ::1, so lo needs a non-loopback IPv6 address; the x/net icmp/ipv4/ipv6
      # tests skip themselves without these.
      - name: Enable loopback IPv6, multicast and unprivileged ICMP (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=0
          sudo ip -6 addr add fd00:5ea1::1/128 dev lo
          sudo ip link set lo multicast on
          ip addr show lo

      - name: Test
        run: |
          # no -e: the summary below must print even when go test fails; the
          # step still exits with go test's status.
          set +e -u
          JSON="$RUNNER_TEMP/go-test.json"
          LOG="$RUNNER_TEMP/go-test.log"
          go test -json ${{ inputs.test-filter || './...' }} > "$JSON"
          status=$?
          jq -r 'select(.Action=="output") | .Output' "$JSON" | tr -d '\r' > "$LOG"
          echo "=== Package results ==="
          jq -r 'select(.Test==null and (.Action=="pass" or .Action=="fail" or .Action=="skip")) | "\(.Action) \(.Package)"' "$JSON"
          echo "=== Skipped tests (package, test: reason as printed by t.Skip) ==="
          jq -rs '
            map(select(.Test != null))
            | group_by(.Package + " " + .Test)
            | map(select(any(.[]; .Action == "skip")))
            | .[]
            | "SKIP \(.[0].Package) \(.[0].Test): " + (
                [ .[] | select(.Action == "output") | .Output | gsub("\r"; "")
                  | select(test("^\\s*(=== (RUN|PAUSE|CONT|NAME)|--- )") | not)
                  | gsub("^\\s+|\\s+$"; "") | select(length > 0) ]
                | if length == 0 then "(no message printed)" else join(" | ") end)
          ' "$JSON"
          if [ "$status" -ne 0 ]; then
            echo "=== Full test log (failure) ==="
            cat "$LOG"
          fi
          echo "=== Test summary ==="
          echo "top-level tests passed: $(jq -s '[.[] | select(.Action=="pass" and .Test!=null and (.Test|contains("/")|not))] | length' "$JSON")"
          echo "tests+subtests passed:  $(jq -s '[.[] | select(.Action=="pass" and .Test!=null)] | length' "$JSON")"
          echo "tests+subtests skipped: $(jq -s '[.[] | select(.Action=="skip" and .Test!=null)] | length' "$JSON")"
          echo "tests+subtests failed:  $(jq -s '[.[] | select(.Action=="fail" and .Test!=null)] | length' "$JSON")"
          echo "packages ok: $(jq -s '[.[] | select(.Action=="pass" and .Test==null)] | length' "$JSON")  packages failed: $(jq -s '[.[] | select(.Action=="fail" and .Test==null)] | length' "$JSON")"
          exit "$status"
